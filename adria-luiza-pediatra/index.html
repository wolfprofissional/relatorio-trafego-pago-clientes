<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dra. Adria Luiza · Relatórios de tráfego pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--navy:#3A332D;--navy2:#4B4239;--red:#A2703F;--red2:#B9824C;--peach:#E6CBA8;--sky:#B79C90;--soft:#EADCCB;--ink:#2E2925;--muted:#7A7068;--bg:#F5EEE6;--card:#fff;--line:#E7DACB;--good:#3F8A5C;--bad:#B5483A}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.hero{background:linear-gradient(180deg,#FAF6F1 0%,#EFE3D5 100%);color:var(--navy);padding:30px 0 70px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
header.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:#E9D7C2;opacity:.75}
.logo{width:min(190px,46vw);height:auto;display:block}
.kicker{position:relative;z-index:1;margin:30px 0 0;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:800;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:28px;height:1px;background:var(--red)}
.flogo{width:120px;height:auto;margin:0 auto 14px;opacity:.95}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
._brand{font-family:'Lora',Georgia,serif;font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1}
.brand small{display:block;font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#F29A92;margin-top:8px}
.period{text-align:right;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.period b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:32px;letter-spacing:0;text-transform:none;color:var(--navy)}
.hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,5.6vw,58px);margin:10px 0 14px;line-height:1.04;letter-spacing:-.01em;position:relative;z-index:1;max-width:18ch;color:var(--navy)}
.hero h1 em{color:var(--red);font-style:italic}
.hero p.lead{margin:0;max-width:64ch;color:#5A514A;font-size:17px;position:relative;z-index:1}
.hero p.lead b{color:var(--navy)}
section{padding:34px 0 6px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:800;margin:0 0 6px}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(23px,3vw,30px);color:var(--navy);margin:0 0 6px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 18px;max-width:74ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-top:-40px;position:relative;z-index:2}
.kpi{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line);box-shadow:0 8px 26px rgba(58,51,45,.08)}
.kpi.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.k-lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.kpi.main .k-lab{color:var(--peach)}
.k-num{font-weight:800;font-size:clamp(26px,2.6vw,34px);margin:4px 0 2px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-note{font-size:12.5px;margin:0;color:var(--muted)} .kpi.main .k-note{color:#D9CFC4}
.delta{font-weight:800;font-size:12.5px}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)} .delta.neutral{color:var(--navy)}
.vs{color:var(--muted);font-size:12px}
.kpi.main .delta{color:#fff;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:99px} .kpi.main .vs{color:#D9CFC4}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card h3{margin:0 0 4px;font-size:17px;color:var(--navy);font-weight:800}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
.note b{color:var(--ink)}
.channel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;border-top:4px solid var(--red)}
.ch.g{border-top-color:var(--navy)} .ch.s{border-top-color:var(--sky)}
.ch h3{margin:0 0 2px;font-size:16.5px;color:var(--navy)}
.ch p{margin:0;color:var(--muted);font-size:13.5px}
.ch .c-stats{margin:14px 0 0}
.c-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.c-stats div{background:#F8F2EA;border-radius:10px;padding:9px}
.c-stats dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.c-stats dd{margin:2px 0 0;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:46px 0 0;padding:14px 20px;border-radius:14px;background:var(--navy);color:#fff}
.sec-band.g{background:var(--red)}
.sec-band b{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:400}
.sec-band span{color:var(--peach);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.sec-band.g span{color:#F3E2CC}
.camp h3{margin:0 0 12px;font-size:17px;color:var(--navy)}
.camp .c-tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-bottom:10px;font-weight:800}
.fn-step{margin:8px 0}
.fn-bar{color:#fff;border-radius:8px;padding:6px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.fn-lab{font-size:13px;color:var(--ink);margin-top:3px}
.fn-rate{color:var(--muted);margin-left:8px;font-size:12px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tick{font-size:12px;fill:var(--muted);font-family:inherit}
.tick2{font-size:11.5px;fill:var(--navy);font-family:inherit;font-weight:700}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin-bottom:16px}
.ins{background:var(--navy);color:#fff;border-radius:18px;padding:18px}
.ins .big{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:36px;color:var(--peach);line-height:1;margin:0 0 6px}
.ins p{margin:0;font-size:14px;color:#E2D8CD} .ins p b{color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
tr.best td{background:#F3E6D6}
.gb-row{display:grid;grid-template-columns:minmax(70px,90px) 1fr;gap:12px;align-items:center;padding:5px 0}
.gb-lab{font-size:13.5px;font-weight:700;color:var(--navy);white-space:nowrap}
.bar{position:relative;height:26px;background:#F1E8DD;border-radius:999px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:999px;opacity:.85}
.val{position:relative;font-size:12.5px;padding:4px 11px;display:block;white-space:nowrap;font-variant-numeric:tabular-nums}
.crs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid}
.cr-thumb{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,var(--navy2),var(--navy));display:flex;align-items:center;justify-content:center}
.cr-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cr-ph{color:var(--peach);font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;text-align:center;padding:16px}
.cr-tag{position:absolute;left:10px;top:10px;z-index:2;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.cr-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cr-camp{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800}
.cr h4{margin:0;font-size:16px;color:var(--navy)}
.cr-copy{margin:0;font-size:12.5px;color:var(--muted);font-style:italic}
.cr-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0 0}
.cr-stats dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cr-stats dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.cr-foot{margin:auto 0 0;padding-top:8px;font-size:12px;color:var(--ink);border-top:1px dashed var(--line)}
.analysis{background:var(--navy);color:#E2D8CD;border-radius:22px;padding:30px clamp(18px,4vw,40px);margin-top:10px}
.analysis h2{color:#fff} .analysis .eyebrow{color:var(--peach)}
.analysis h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--peach);font-size:23px;margin:26px 0 8px}
.analysis p,.analysis li{color:#E2D8CD} .analysis b{color:#fff}
.analysis ol{padding-left:0;list-style:none;counter-reset:a;margin:0}
.analysis ol li{counter-increment:a;position:relative;padding:12px 0 12px 46px;border-bottom:1px solid rgba(255,255,255,.14)}
.analysis ol li::before{content:counter(a);position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:50%;background:var(--red2);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.prio{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.prio.alta{background:var(--red);color:#fff} .prio.media{background:var(--peach);color:var(--navy)}
footer{padding:34px 0 40px;color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:640px){ .c-stats div{min-width:0;padding:7px} .c-stats dt{font-size:9.5px;letter-spacing:.02em;overflow-wrap:normal} .opt{display:none} th,td{padding:9px 5px;font-size:13px} .period{text-align:left} .c-stats dd{font-size:14px} }
@media print{ body{background:#fff} .card,.kpi,.cr{break-inside:avoid} }

@media (max-width:640px){ .hero-top{align-items:flex-start} .logo{width:150px} }
.analysis ul.sum{list-style:none;padding:0;margin:18px 0 0}
.analysis ul.sum li{position:relative;padding:12px 0 12px 30px;border-bottom:1px solid rgba(255,255,255,.14)}
.analysis ul.sum li::before{content:"";position:absolute;left:4px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--peach)}
.analysis p.closing{margin:18px 0 0;color:var(--peach);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.4}

.list{display:grid;gap:12px;margin:-30px 0 40px;position:relative;z-index:2}
.rep{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;text-decoration:none;color:var(--ink);box-shadow:0 8px 26px rgba(58,51,45,.08)}
.rep:hover{border-color:var(--red)}
.rep b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:24px;color:var(--navy)} .rep span{color:var(--muted);font-size:13.5px}
.rep .go{color:var(--red);font-weight:800;white-space:nowrap}

.hero h1{font-size:clamp(38px,6vw,64px);font-weight:500}
.hero h1 em{font-weight:500}
h2{font-size:clamp(26px,3.4vw,34px);font-weight:600}
.period b{font-size:36px;font-weight:500}
.ins .big{font-size:42px;font-weight:600}
.sec-band b{font-size:30px;font-weight:600}
.analysis h3{font-size:26px}
.analysis p.closing{font-size:22px;font-style:italic}
.logo{width:min(150px,38vw)}
.flogo{width:96px}
.cr-ph{font-size:24px}
.cr-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:start}
.rep b{font-size:28px}
.gb-row{grid-template-columns:minmax(70px,130px) 1fr}
</style></head><body>
