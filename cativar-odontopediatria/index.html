<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cativar Odontopediatria · Relatórios de tráfego pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--cocoa:#7A5A47;--cocoa2:#93725C;--rose2:#B4628B;--rose:#E2A8C9;--sage:#C3D49A;--sage2:#7E9A4C;--butter:#F2D59A;--soft:#F3ECE3;--ink:#4A3A2F;--muted:#857467;--bg:#FBF8F3;--card:#fff;--line:#EFE4D8;--good:#4F8A3A;--bad:#C0392B}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.hero{background:linear-gradient(180deg,#FDFBF7 0%,#F6EEE4 100%);color:var(--cocoa);padding:30px 0 70px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
header.hero::before{content:"";position:absolute;left:-90px;bottom:-130px;width:260px;height:260px;border-radius:50%;background:#EEF2DE;opacity:.9}
header.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:#F7E3EE;opacity:.9}
.logo{width:min(220px,50vw);height:auto;display:block;position:relative;z-index:1}
.kicker{position:relative;z-index:1;margin:30px 0 0;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose2);font-weight:800;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:28px;height:1px;background:var(--rose2)}
.flogo{width:130px;height:auto;margin:0 auto 14px;opacity:.95}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.period{text-align:right;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.period b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:32px;letter-spacing:0;text-transform:none;color:var(--cocoa)}
.hero h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(32px,5.2vw,54px);margin:10px 0 14px;line-height:1.06;letter-spacing:-.01em;position:relative;z-index:1;max-width:18ch;color:var(--cocoa)}
.hero h1 em{color:var(--rose2);font-style:normal}
.hero p.lead{margin:0;max-width:64ch;color:#6A5A4E;font-size:17px;position:relative;z-index:1}
.hero p.lead b{color:var(--cocoa)}
section{padding:34px 0 6px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose2);font-weight:800;margin:0 0 6px}
h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(23px,3vw,30px);color:var(--cocoa);margin:0 0 6px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 18px;max-width:74ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-top:-40px;position:relative;z-index:2}
.kpi{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line);box-shadow:0 8px 26px rgba(122,90,71,.08)}
.kpi.main{background:var(--cocoa);color:#fff;border-color:var(--cocoa)}
.k-lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.kpi.main .k-lab{color:var(--butter)}
.k-num{font-weight:900;font-size:clamp(26px,2.6vw,34px);margin:4px 0 2px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-note{font-size:12.5px;margin:0;color:var(--muted)} .kpi.main .k-note{color:#EADBCF}
.delta{font-weight:800;font-size:12.5px}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)} .delta.neutral{color:var(--cocoa)}
.vs{color:var(--muted);font-size:12px}
.kpi.main .delta{color:#fff;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:99px} .kpi.main .vs{color:#EADBCF}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card h3{margin:0 0 4px;font-size:17px;color:var(--cocoa);font-weight:800}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
.note b{color:var(--ink)}
.channel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;border-top:4px solid var(--rose)}
.ch.g{border-top-color:var(--sage)} .ch.s{border-top-color:var(--butter)}
.ch h3{margin:0 0 2px;font-size:16.5px;color:var(--cocoa)}
.ch p{margin:0;color:var(--muted);font-size:13.5px}
.ch .c-stats{margin:14px 0 0}
.c-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.c-stats div{background:#FBF6F0;border-radius:10px;padding:9px}
.c-stats dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.c-stats dd{margin:2px 0 0;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:46px 0 0;padding:14px 20px;border-radius:14px;background:var(--cocoa);color:#fff}
.sec-band.g{background:var(--rose2)}
.sec-band b{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600}
.sec-band span{color:#FBE7F1;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tick{font-size:12px;fill:var(--muted);font-family:inherit}
.tick2{font-size:11.5px;fill:var(--cocoa);font-family:inherit;font-weight:700}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin-bottom:16px}
.ins{background:var(--cocoa);color:#fff;border-radius:18px;padding:18px}
.ins .big{font-family:'Fredoka',sans-serif;font-weight:600;font-size:34px;color:var(--butter);line-height:1;margin:0 0 6px}
.ins p{margin:0;font-size:14px;color:#EADBCF} .ins p b{color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
tr.best td{background:#F1F5E4}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.st.on{background:#E8F0D6;color:#4F6B2A} .st.off{background:#F1ECE6;color:#857467}
.gb-row{display:grid;grid-template-columns:minmax(100px,175px) 1fr;gap:12px;align-items:center;padding:5px 0}
.gb-lab{font-size:13.5px;font-weight:700;color:var(--cocoa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-lab.me{color:var(--rose2)}
.bar{position:relative;height:26px;background:#F5EFE7;border-radius:999px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:999px;opacity:.9}
.val{position:relative;font-size:12.5px;padding:4px 11px;display:block;white-space:nowrap;font-variant-numeric:tabular-nums}
.analysis{background:var(--cocoa);color:#EADBCF;border-radius:22px;padding:30px clamp(18px,4vw,40px);margin-top:10px}
.analysis h2{color:#fff} .analysis .eyebrow{color:var(--butter)}
.analysis p,.analysis li{color:#EADBCF} .analysis b{color:#fff}
.analysis ul.sum{list-style:none;padding:0;margin:18px 0 0}
.analysis ul.sum li{position:relative;padding:12px 0 12px 30px;border-bottom:1px solid rgba(255,255,255,.14)}
.analysis ul.sum li::before{content:"";position:absolute;left:4px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--rose)}
.analysis p.closing{margin:18px 0 0;color:var(--butter);font-family:'Fredoka',sans-serif;font-weight:500;font-size:19px;line-height:1.4}
footer{padding:34px 0 40px;color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:640px){ .c-stats div{min-width:0;padding:7px} .c-stats dt{font-size:9.5px;letter-spacing:.02em} .opt{display:none} th,td{padding:9px 5px;font-size:13px} .period{text-align:left} .c-stats dd{font-size:14px} .hero-top{align-items:flex-start} .logo{width:170px} }
@media print{ body{background:#fff} .card,.kpi{break-inside:avoid} }

.list{display:grid;gap:12px;margin:-30px 0 40px;position:relative;z-index:2}
.rep{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;text-decoration:none;color:var(--ink);box-shadow:0 8px 26px rgba(122,90,71,.08)}
.rep:hover{border-color:var(--rose2)}
.rep b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;color:var(--cocoa)} .rep span{color:var(--muted);font-size:13.5px}
.rep .go{color:var(--rose2);font-weight:800;white-space:nowrap}
</style></head><body>
